on:
  push:
    branches: [main]
  # Weekly refresh: fetch new plays from the PDS, rebuild the stats,
  # and redeploy so the Music section stays current between pushes.
  # Runs on the default branch with the latest committed code.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Every run step needs the nix dev shell's tools (gleam, cargo,
    # just), so use it as the job shell instead of repeating
    # `nix develop -c` on each step.
    defaults:
      run:
        shell: nix develop -c bash -- {0}
    steps:
      - uses: actions/checkout@v7
      - uses: determinatesystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - run: just test

      # Cargo artifacts keyed on Cargo.lock: restored as-is between
      # runs (cargo reuses the target via fingerprints) and only
      # rewritten when the dependency set actually changes.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            tools/parse-plays/target
          key: cargo-${{ hashFiles('tools/parse-plays/Cargo.lock') }}
          restore-keys: cargo-
      # The cover-art cache is append-only and grows every run, so it
      # must save each time — but it's a few KB, unlike the target dir.
      # The mirrored image cache (priv/cache/img) gets the same
      # treatment: once a cover/artist photo is downloaded it never
      # needs the network again.
      - uses: actions/cache@v4
        with:
          path: |
            priv/cache/cover-cache.json
            priv/cache/img
          key: cover-cache-${{ github.run_id }}
          restore-keys: cover-cache-

      - run: cargo test --release --manifest-path tools/parse-plays/Cargo.toml
      - run: just refresh
      - run: just build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
