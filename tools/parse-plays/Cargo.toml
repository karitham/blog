[package]
name = "parse-plays"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
chrono = "0.4"
cid = { version = "0.11", features = ["serde"] }
jacquard-common = "0.12"
jacquard-repo = "0.12"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_ipld_dagcbor = "0.6"
serde_json = "1"
smol_str = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["fs", "macros", "rt", "rt-multi-thread"] }
ureq = "2"
