[package]
name = "parse-plays"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
rayon = "1"
repo-stream = "0.4"
serde = { version = "1", features = ["derive"] }
serde_ipld_dagcbor = "0.6"
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "rt", "rt-multi-thread"] }
ureq = "2"
